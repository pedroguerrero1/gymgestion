<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GymGestión - Iniciar sesión</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="adminlte/plugins/fontawesome-free/css/all.min.css"
    />

    <!-- AdminLTE -->
    <link rel="stylesheet" href="adminlte/dist/css/adminlte.min.css" />

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/estilos.css" />

    <!-- Nuestro JavaScript -->
    <script type="module" src="js/login.js" defer></script>
  </head>

  <body class="hold-transition login-page">
    <div class="login-box">
      <div class="login-logo">
        <i class="fas fa-heartbeat"></i>
        <b>Gym</b>Gestión
        <p class="lema">Movete, reservá y entrená</p>
      </div>

      <div class="card">
        <div class="card-body login-card-body">
          <p class="login-box-msg">Ingresá tus datos para comenzar</p>

          <form id="form-login">
            <div class="input-group mb-3">
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Correo electrónico"
                required
              />

              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-envelope"></span>
                </div>
              </div>
            </div>

            <div class="input-group mb-3">
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Contraseña"
                required
              />

              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-lock"></span>
                </div>
              </div>
            </div>

            <p class="text-danger" id="mensaje-error"></p>

            <div class="row">
              <div class="col-12">
                <button type="submit" class="btn btn-primary btn-block">
                  Ingresar
                </button>
              </div>
            </div>
          </form>

          <p class="mt-3 mb-0 text-center">
            <a href="registro.html">No tengo cuenta, quiero registrarme</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
