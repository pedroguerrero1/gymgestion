<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GymGestión - Crear cuenta</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="adminlte/plugins/fontawesome-free/css/all.min.css"
    />

    <!-- AdminLTE -->
    <link rel="stylesheet" href="adminlte/dist/css/adminlte.min.css" />

    <script type="module" src="js/registro.js"></script>
  </head>

  <body class="hold-transition register-page">
    <div class="register-box">
      <div class="register-logo">
        <b>GymGestión</b>
      </div>

      <div class="card">
        <div class="card-body register-card-body">
          <p class="login-box-msg">Creá tu cuenta de socio</p>

          <form id="form-registro">
            <div class="input-group mb-3">
              <input
                type="text"
                class="form-control"
                id="nombre"
                placeholder="Nombre y apellido"
                required
              />

              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-user"></span>
                </div>
              </div>
            </div>

            <div class="input-group mb-3">
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Correo electrónico"
                required
              />

              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-envelope"></span>
                </div>
              </div>
            </div>

            <div class="input-group mb-3">
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Contraseña"
                minlength="4"
                required
              />

              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-lock"></span>
                </div>
              </div>
            </div>

            <div class="input-group mb-3">
              <input
                type="password"
                class="form-control"
                id="password2"
                placeholder="Repetir contraseña"
                required
              />

              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-lock"></span>
                </div>
              </div>
            </div>

            <p class="text-danger" id="mensaje-error"></p>

            <div class="row">
              <div class="col-12">
                <button type="submit" class="btn btn-primary btn-block">
                  Registrarme
                </button>
              </div>
            </div>
          </form>

          <p class="mt-3 mb-0 text-center">
            <a href="index.html">Ya tengo cuenta</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
